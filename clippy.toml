# Identifiers that clippy::doc_markdown should not flag
# as needing backticks in doc comments.
#
# Curated list of terms that recur in Rust infra code
# and would otherwise force every doc comment that
# mentions them to backtick each occurrence. The block
# below the template's list holds kozmotic's own
# domain terms; append there rather than redefining.
doc-valid-idents = [
    # clippy's built-in defaults are preserved; the
    # entries below are additions.
    "..",
    "PowerShell",
    "WebSocket",
    "WebSockets",
    "JSON",
    "JSONL",
    "YAML",
    "TOML",
    "XML",
    "HTML",
    "CSS",
    "FFI",
    "ABI",
    "macOS",
    "GitHub",
    "GitLab",
    "OAuth",
    "stdin",
    "stdout",
    "stderr",
    "cdylib",
    "rlib",
    "Tokio",
    "Axum",
    "Svelte",
    "Vite",
    "Playwright",
    "Cargo",
    "rustc",
    "rustfmt",
    "rustup",
    "Clippy",
    # kozmotic domain terms.
    "Kozmotic",
    "Claude",
    "ANSI",
    "CLI",
    "UUID",
    "Unicode",
]
