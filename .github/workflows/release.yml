name: Release

on:
  push:
    tags: [ "v*.*.*" ]

permissions:
  contents: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    name: Build (${{ matrix.target }})
    needs: ci
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          # Linux builds are pinned to the oldest supported runner
          # rather than ubuntu-latest: the glibc they link against
          # becomes the minimum glibc of every machine that can run
          # the artifact. 22.04 ships glibc 2.35, which covers
          # Ubuntu 22.04+, Debian 12+, and RHEL 9+.
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
            archive: tar.gz
            install_doc: docs/install/linux.md
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
            archive: tar.gz
            install_doc: docs/install/linux.md
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            archive: zip
            install_doc: docs/install/windows.md
          - target: aarch64-apple-darwin
            runner: macos-latest
            archive: tar.gz
            install_doc: docs/install/macos.md
          - target: x86_64-apple-darwin
            runner: macos-latest
            archive: tar.gz
            install_doc: docs/install/macos.md
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup target add ${{ matrix.target }}

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: >
          sudo apt-get update &&
          sudo apt-get install -y libasound2-dev

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Determine archive name
        id: archive
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME}"
          NAME="kozmotic-${VERSION}-${{ matrix.target }}"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"

      - name: Package (tar.gz)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          STAGING="${{ steps.archive.outputs.name }}"
          mkdir "$STAGING"
          cp target/${{ matrix.target }}/release/kozmotic "$STAGING/"
          cp "${{ matrix.install_doc }}" "$STAGING/INSTALL.md"
          cp LICENSE "$STAGING/"
          tar czf "${STAGING}.tar.gz" "$STAGING"

      - name: Package (zip)
        if: matrix.archive == 'zip'
        shell: bash
        run: |
          STAGING="${{ steps.archive.outputs.name }}"
          mkdir "$STAGING"
          cp target/${{ matrix.target }}/release/kozmotic.exe "$STAGING/"
          cp "${{ matrix.install_doc }}" "$STAGING/INSTALL.md"
          cp LICENSE "$STAGING/"
          7z a "${STAGING}.zip" "$STAGING"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.archive.outputs.name }}
          path: ${{ steps.archive.outputs.name }}.${{ matrix.archive }}
          if-no-files-found: error

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # Notes come from the dated CHANGELOG section for this exact
      # version, and from nothing else.
      #
      # The previous version of this accepted `[Unreleased]` as a
      # fallback, which looks like a convenience and is a trap:
      # `[Unreleased]` is the first `## [` heading in the file, so
      # it matched before the version's own section was ever
      # reached -- and a release has just emptied it. v1.2.0
      # shipped with empty notes for exactly this reason, and
      # nothing failed to say so.
      #
      # Matching the version heading by exact prefix, and failing
      # when it is absent, is what keeps that mistake loud.
      - name: Extract release notes from CHANGELOG
        id: notes
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v prefix="## [${VERSION}]" '
            /^## \[/ {
              if (found) exit
              found = (substr($0, 1, length(prefix)) == prefix)
              next
            }
            found { print }
          ' CHANGELOG.md > release_notes.md

          if [ ! -s release_notes.md ]; then
            echo "::error::CHANGELOG.md has no section for [${VERSION}]." \
                 "Promote [Unreleased] to a dated section before tagging."
            exit 1
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME"
          --title "$GITHUB_REF_NAME"
          --notes-file release_notes.md
          artifacts/*
