name: Release

on:
  push:
    tags: [ "v*.*.*" ]

permissions:
  contents: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    name: Build (${{ matrix.target }})
    needs: ci
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          # Linux builds are pinned to the oldest supported runner
          # rather than ubuntu-latest: the glibc they link against
          # becomes the minimum glibc of every machine that can run
          # the artifact. 22.04 ships glibc 2.35, which covers
          # Ubuntu 22.04+, Debian 12+, and RHEL 9+.
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
            archive: tar.gz
            install_doc: docs/install/linux.md
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
            archive: tar.gz
            install_doc: docs/install/linux.md
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            archive: zip
            install_doc: docs/install/windows.md
          - target: aarch64-apple-darwin
            runner: macos-latest
            archive: tar.gz
            install_doc: docs/install/macos.md
          - target: x86_64-apple-darwin
            runner: macos-latest
            archive: tar.gz
            install_doc: docs/install/macos.md
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup target add ${{ matrix.target }}

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: >
          sudo apt-get update &&
          sudo apt-get install -y libasound2-dev

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Determine archive name
        id: archive
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME}"
          NAME="kozmotic-${VERSION}-${{ matrix.target }}"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"

      - name: Package (tar.gz)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          STAGING="${{ steps.archive.outputs.name }}"
          mkdir "$STAGING"
          cp target/${{ matrix.target }}/release/kozmotic "$STAGING/"
          cp "${{ matrix.install_doc }}" "$STAGING/INSTALL.md"
          cp LICENSE "$STAGING/"
          tar czf "${STAGING}.tar.gz" "$STAGING"

      - name: Package (zip)
        if: matrix.archive == 'zip'
        shell: bash
        run: |
          STAGING="${{ steps.archive.outputs.name }}"
          mkdir "$STAGING"
          cp target/${{ matrix.target }}/release/kozmotic.exe "$STAGING/"
          cp "${{ matrix.install_doc }}" "$STAGING/INSTALL.md"
          cp LICENSE "$STAGING/"
          7z a "${STAGING}.zip" "$STAGING"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.archive.outputs.name }}
          path: ${{ steps.archive.outputs.name }}.${{ matrix.archive }}
          if-no-files-found: error

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # Notes come from the dated CHANGELOG section for this exact
      # version, and from nothing else.
      #
      # The previous version of this accepted `[Unreleased]` as a
      # fallback, which looks like a convenience and is a trap:
      # `[Unreleased]` is the first `## [` heading in the file, so
      # it matched before the version's own section was ever
      # reached -- and a release has just emptied it. v1.2.0
      # shipped with empty notes for exactly this reason, and
      # nothing failed to say so.
      #
      # Matching the version heading by exact prefix, and failing
      # when it is absent, is what keeps that mistake loud.
      - name: Extract release notes from CHANGELOG
        id: notes
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v prefix="## [${VERSION}]" '
            /^## \[/ {
              if (found) exit
              found = (substr($0, 1, length(prefix)) == prefix)
              next
            }
            found { print }
          ' CHANGELOG.md > release_notes.md

          if [ ! -s release_notes.md ]; then
            echo "::error::CHANGELOG.md has no section for [${VERSION}]." \
                 "Promote [Unreleased] to a dated section before tagging."
            exit 1
          fi

      # Downstream consumers pin kozmotic by SHA-256 -- both the
      # archive they download and the binary they extract from it, as
      # `vagrant/provision.sh` does. Publishing both digests turns
      # that pin from a value someone re-derived by hand into one
      # checkable against the release.
      #
      # The release job downloads all five build artifacts into one
      # directory, so it is the only place a single SHA256SUMS can be
      # produced.
      - name: Checksum the assets
        run: scripts/checksum-assets.sh artifacts

      # Published releases are immutable here, and a release is
      # published only once all its assets are up.
      #
      # The tag alone cannot carry that guarantee: rewriting history
      # moves every tag, so a re-pushed tag re-runs this job against
      # bytes consumers may already have pinned. So the release is
      # built as a draft, gets its assets, and is published last --
      # which also means a run that dies partway leaves a draft
      # rather than a half-filled release, and the retry starts over
      # from an empty one.
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"

          if gh release view "$tag" > /dev/null 2>&1; then
            # Fail closed: an API error here must not be read as
            # "no release exists yet", which would send us on to
            # overwrite one.
            if ! state=$(
              gh release view "$tag" --json isDraft,assets \
                --jq '(.isDraft|tostring) + " " + (
                  [.assets[].name] | index("SHA256SUMS") | tostring
                )'
            ); then
              echo "::error::cannot read the state of $tag;" \
                   "refusing to touch it"
              exit 1
            fi
            case "$state" in
              "true "*)
                # A draft is the leftover of a run that did not
                # finish. Delete it so the asset set is exactly what
                # this run built -- `--clobber` would replace
                # same-named assets but keep any others, and
                # SHA256SUMS would then not cover every download.
                # The git tag is untouched: no --cleanup-tag.
                echo "$tag has an unfinished draft release; replacing it"
                gh release delete "$tag" --yes
                ;;
              "false null")
                echo "::error::$tag is already published, without" \
                     "checksums. Adding them would rewrite a release" \
                     "consumers may have pinned. Do it by hand, or" \
                     "tag a new version."
                exit 1
                ;;
              *)
                echo "::notice::$tag is already published with" \
                     "checksums; nothing to do."
                exit 0
                ;;
            esac
          fi

          gh release create "$tag" --draft \
            --title "$tag" \
            --notes-file release_notes.md \
            artifacts/kozmotic-*
          # Last, and only once the archives are up, so its presence
          # means the release is complete.
          gh release upload "$tag" artifacts/SHA256SUMS
          gh release edit "$tag" --draft=false
